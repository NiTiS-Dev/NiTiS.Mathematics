name: Publish

on:
  release:
    types: [published]

permissions:
  actions: read

jobs:
  build:
    permissions:
      id-token: write # enable GitHub OIDC token issuance for this job
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Login to NuGet via OIDC
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.OIDC_USER }}

      - name: Generate package
        run: dotnet pack -c Release

      - name: NuGet publish
        run: |
          dotnet nuget push outPackages/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate